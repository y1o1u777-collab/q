<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Krathong Admin</title><link rel="stylesheet" href="admin.css"></head>
<body><main class="shell"><header><a href="../">← กลับเว็บไซต์</a><p class="eyebrow">MOONLIGHT KRATHONG</p><h1>Admin Console</h1><p>จัดการคำอธิษฐานอย่างปลอดภัย</p></header>
<section id="loginPanel" class="panel"><h2>เข้าสู่ระบบ</h2><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Login</button></form><p id="status" role="status"></p></section>
<section id="dashboard" class="panel" hidden><div class="toolbar"><h2>คำอธิษฐาน</h2><button id="logout" class="secondary">ออกจากระบบ</button></div><p id="count"></p><div id="list"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/config.js"></script><script src="admin.js"></script></body></html>
